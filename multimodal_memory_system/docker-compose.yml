services:
  mysql:
    image: mysql:8.0
    container_name: mm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multimodal
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: mm-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Milvus 依赖的元数据存储（standalone 进程默认不内置 etcd，需单独提供）
  etcd:
    image: bitnami/etcd:3.5.14
    container_name: mm-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/bitnami/etcd

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: mm-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  # 可选：缓存，如不需要可移除
  # redis:
  #   image: redis:7-alpine
  #   container_name: mm-redis
  #   ports:
  #     - "6379:6379"

volumes:
  mysql-data:
  minio-data:
  milvus-data:
  etcd-data: